<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActiBreak - Catálogo</title>

    <meta property="og:image" content="../Img/Logo.png">
    <link rel="icon" href="../Img/Logo.png">

    <!-- Enlace a JavaScript para generar las tarjetas de los ejercicios -->
    <script defer src="../JavaScript/catalog.js"></script>
    <script async src="../JavaScript/color.js"></script>

    <!-- Enlace a hojas de estilos CSS -->
    <link rel="stylesheet" href="../CSS/header.css"><style></style>
    <link rel="stylesheet" href="../CSS/cardCatalog.css"><style></style>
    <link rel="stylesheet" href="../CSS/neon.css"><style></style>
    <link rel="stylesheet" href="../CSS/catalog.css"><style></style>


    <!-- Google Fonts -->
    <!--Títulos-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">

    <!--Párrafos-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-parent">
            <a href="../index.html" class="header-icon">
                <div class="header-icon">
                    <img src="../Img/Logo.png" alt="Logo de la aplicación">
                </div>
            </a>
            <a href="../index.html" class="header-name">
                <div class="header-name">
                    <img src="../Img/Nombre.png" alt="Imagen con el nombre de la aplicación, degradado de azul a morado">
                </div>
            </a>
            <a href="../HTML/historial.html" class="header-history">
                 <div class="header-history">
                    <img src="../Img/Historial.png" alt="Logo de historial">
                    <h1>Historial</h1>
                </div>
            </a>
        </div>
    </header>
    <div class="Title">
        <h2>Catálogo de Ejercicios</h2>
    </div>
    <div class="main-content">
        <div class="main-card-parent">
            <div class="main-card yellow-green">

                <div class="yellow-green-before"></div>
                <div class="yellow-green-after"></div>

                <div class="catalogo-container">
                    <div class="filtros">
                        <select id="filtro-intensidad" aria-label="Intensidades">
                            <option value="todos">Todas las intensidades</option>
                            <option value="Baja">Baja</option>
                            <option value="Media">Media</option>
                            <option value="Alta">Alta</option>
                        </select>
                        <select id="filtro-enfoque" aria-label="Enfoque">
                            <option value="todos">Todos los enfoques</option>
                            <option value="Tren superior">Tren superior</option>
                            <option value="Tren inferior">Tren inferior</option>
                            <option value="Tronco">Tronco</option>
                        </select>
                    </div>
                    <div id="grid-ejercicios" class="grid-ejercicios">

                    </div>
                </div>
                <div id="popup" class="popup hide">
                    <div class="popup-content" id="popup-content">
                        <div class="popup-up">
                            <button id="close-popup" class="close-btn">X</button>
                        </div>
                        <div class="popup-down">
                            <div class="popup-left">
                                <div class="video-container">
                                    <video id="video-popup" autoplay loop muted playsinline webkit-playsinline></video>
                                </div>
                                <button id="toggle-personaje" class="btn-personaje">Cambiar personaje</button>
                            </div>
                            <div class="popup-right">
                                <h5 id="popup-nombre">Nombre</h5>
                                <p id="popup-descripcion"></p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <div class="two-card-parent">
            <a href="../HTML/Generador.html" class="second-card">
                <div class="second-card blue-purple">

                    <div class="blue-purple-before"></div>
                    <div class="blue-purple-after"></div>

                    <h4 class="title-second">Personaliza tu Pausa Activa</h4>
                </div>
            </a>
            <a href="../HTML/Importancia.html" class="third-card">
                <div class="third-card red-orange">

                    <div class="red-orange-before"></div>
                    <div class="red-orange-after"></div>

                    <h4 class="title-third">Importancia de las Pausas Activas</h4>
                </div>
            </a>
        </div>
    </div>

    <footer>
        <div class="gradient">

        </div>
        <div class="footer-parent">
            <a href="../HTML/about.html" class="footer-child">
                 <div class="footer-about">
                    <img src="../Img/Informacion.png" alt="Icono de Información">
                    <h1>Acerca de</h1>
                </div>
            </a>
            <a href="../HTML/manual.html" class="footer-child">
                 <div class="footer-manual">
                    <h1>Manual de Usuario</h1>
                </div>
            </a>
            <a href="../HTML/config.html" class="footer-child">
                 <div class="footer-config">
                    <img src="../Img/Config.png" alt="Icono de configuración">
                    <h1>Configuración</h1>
                </div>
            </a>
        </div>
        <div class="autoría">
            <h6>Desarrollado por David Pineda - 2025</h6>
        </div>
    </footer>
</body>
</html>
